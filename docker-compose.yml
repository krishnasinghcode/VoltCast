services:
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=12
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    networks: [cvi-net]

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [cvi-net]

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    volumes: [mongodata:/data/db]
    networks: [cvi-net]

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
    networks: [cvi-net]

  data-gen:
    build: ./services/data-gen
    restart: unless-stopped
    ports: ["8001:8001"]
    env_file: .env
    depends_on: [kafka, postgres]
    networks: [cvi-net]

  ingestion:
    build: ./services/ingestion
    restart: unless-stopped
    ports: ["8002:8002"]
    env_file: .env
    depends_on: [kafka, postgres, mongo, redis]
    networks: [cvi-net]

  ml:
    build: ./services/ml
    restart: unless-stopped
    ports: ["8003:8003"]
    env_file: .env
    volumes: [./services/ml/models:/app/models]
    depends_on: [postgres]
    networks: [cvi-net]

  # --- Part D (dashboard): API backend + React frontend, both under services/dashboard/ ---
  api:
    build: ./services/dashboard/api
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: .env
    environment:
      # override from the shell for load tests: RATE_LIMIT_PER_MINUTE=100000000 docker compose up -d api
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
    # data-gen / ml are proxied lazily over HTTP, so they are not hard start-up dependencies.
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [cvi-net]

  frontend:
    build: ./services/dashboard/frontend
    restart: unless-stopped
    # production build served by nginx, which also reverse-proxies /api and /ws to the api container
    ports: ["3000:80"]
    depends_on: [api]
    networks: [cvi-net]

networks:
  cvi-net:

volumes:
  pgdata:
  mongodata:
  kafkadata:
