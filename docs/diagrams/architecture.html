<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin:0; background:#0b1220; font-family: -apple-system, Segoe UI, Arial, sans-serif; }
</style></head>
<body>
<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8aa0c8"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#0b1220"/>
  <text x="600" y="40" text-anchor="middle" fill="#e8edf7" font-size="26" font-weight="600">Connected Vehicle Intelligence — Architecture (C4 Level 2: Containers)</text>

  <!-- Part A: data-gen -->
  <rect x="40" y="90" width="220" height="110" rx="10" fill="#1b2b4a" stroke="#4d6fa8" stroke-width="2"/>
  <text x="150" y="120" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">data-gen</text>
  <text x="150" y="142" text-anchor="middle" fill="#a9bde0" font-size="12">Part A · Python/FastAPI</text>
  <text x="150" y="162" text-anchor="middle" fill="#cfe" font-size="12">Simulates 100K-vehicle fleet</text>
  <text x="150" y="180" text-anchor="middle" fill="#cfe" font-size="12">Kafka producer, deterministic seed</text>

  <!-- Kafka -->
  <rect x="330" y="90" width="200" height="110" rx="10" fill="#2a1b4a" stroke="#7a4da8" stroke-width="2"/>
  <text x="430" y="120" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">Kafka</text>
  <text x="430" y="142" text-anchor="middle" fill="#c9a9e0" font-size="12">telemetry.raw · 12 partitions</text>
  <text x="430" y="162" text-anchor="middle" fill="#eecfff" font-size="12">Durable, replayable,</text>
  <text x="430" y="180" text-anchor="middle" fill="#eecfff" font-size="12">partitioned by vehicle_id</text>

  <!-- Part B: ingestion -->
  <rect x="600" y="90" width="230" height="110" rx="10" fill="#1b2b4a" stroke="#4d6fa8" stroke-width="2"/>
  <text x="715" y="120" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">ingestion</text>
  <text x="715" y="142" text-anchor="middle" fill="#a9bde0" font-size="12">Part B · plain Kafka consumer</text>
  <text x="715" y="162" text-anchor="middle" fill="#cfe" font-size="12">Bloom-filter dedup, validation,</text>
  <text x="715" y="180" text-anchor="middle" fill="#cfe" font-size="12">windowed aggregation</text>

  <!-- arrow data-gen -> kafka -->
  <line x1="260" y1="145" x2="328" y2="145" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- arrow kafka -> ingestion -->
  <line x1="530" y1="145" x2="598" y2="145" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data stores row -->
  <rect x="600" y="260" width="150" height="90" rx="10" fill="#1a3a2e" stroke="#4da87a" stroke-width="2"/>
  <text x="675" y="288" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">PostgreSQL</text>
  <text x="675" y="308" text-anchor="middle" fill="#a9e0c0" font-size="11">Relational core + aggregates</text>
  <text x="675" y="326" text-anchor="middle" fill="#a9e0c0" font-size="11">predictions, alerts, users</text>

  <rect x="770" y="260" width="150" height="90" rx="10" fill="#3a2e1a" stroke="#a87a4d" stroke-width="2"/>
  <text x="845" y="288" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">MongoDB</text>
  <text x="845" y="308" text-anchor="middle" fill="#e0c0a9" font-size="11">Raw telemetry firehose</text>
  <text x="845" y="326" text-anchor="middle" fill="#e0c0a9" font-size="11">(never read by ML/API directly)</text>

  <rect x="940" y="260" width="150" height="90" rx="10" fill="#3a1a2e" stroke="#a84d7a" stroke-width="2"/>
  <text x="1015" y="288" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Redis</text>
  <text x="1015" y="308" text-anchor="middle" fill="#e0a9c0" font-size="11">Latest vehicle state (cache)</text>
  <text x="1015" y="326" text-anchor="middle" fill="#e0a9c0" font-size="11">rate-limit counters</text>

  <line x1="715" y1="200" x2="675" y2="258" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745" y1="200" x2="845" y2="258" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="200" x2="1015" y2="258" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Part C: ml -->
  <rect x="600" y="410" width="230" height="110" rx="10" fill="#1b2b4a" stroke="#4d6fa8" stroke-width="2"/>
  <text x="715" y="440" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">ml</text>
  <text x="715" y="462" text-anchor="middle" fill="#a9bde0" font-size="12">Part C · scikit-learn</text>
  <text x="715" y="482" text-anchor="middle" fill="#cfe" font-size="12">Feature engineering, GBM model,</text>
  <text x="715" y="500" text-anchor="middle" fill="#cfe" font-size="12">risk derivation</text>

  <line x1="675" y1="350" x2="700" y2="408" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="520" x2="675" y2="350" stroke="#8aa0c8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Part D: api + frontend -->
  <rect x="330" y="410" width="220" height="110" rx="10" fill="#1b2b4a" stroke="#4d6fa8" stroke-width="2"/>
  <text x="440" y="440" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">dashboard / api</text>
  <text x="440" y="462" text-anchor="middle" fill="#a9bde0" font-size="12">Part D · FastAPI</text>
  <text x="440" y="482" text-anchor="middle" fill="#cfe" font-size="12">JWT+RBAC, rate limit,</text>
  <text x="440" y="500" text-anchor="middle" fill="#cfe" font-size="12">SQL sandbox, WebSocket</text>

  <line x1="600" y1="465" x2="552" y2="465" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="305" x2="440" y2="408" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="410" width="200" height="110" rx="10" fill="#1b2b4a" stroke="#4d6fa8" stroke-width="2"/>
  <text x="180" y="440" text-anchor="middle" fill="#fff" font-size="17" font-weight="600">frontend</text>
  <text x="180" y="462" text-anchor="middle" fill="#a9bde0" font-size="12">Part D · React + nginx</text>
  <text x="180" y="482" text-anchor="middle" fill="#cfe" font-size="12">Same-origin reverse proxy</text>
  <text x="180" y="500" text-anchor="middle" fill="#cfe" font-size="12">to /api and /ws</text>

  <line x1="330" y1="465" x2="282" y2="465" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- User -->
  <circle cx="180" cy="600" r="22" fill="#2a3a5a" stroke="#8aa0c8" stroke-width="2"/>
  <text x="180" y="606" text-anchor="middle" fill="#fff" font-size="20">👤</text>
  <text x="180" y="645" text-anchor="middle" fill="#cfe" font-size="13">Fleet manager / analyst</text>
  <line x1="180" y1="578" x2="180" y2="522" stroke="#8aa0c8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend / notes -->
  <text x="40" y="700" fill="#7f95c0" font-size="12">Solid arrows: primary data flow. Dashed arrow: ml reads Postgres aggregates to build features and writes predictions back.</text>
  <text x="40" y="720" fill="#7f95c0" font-size="12">All services containerized (Docker Compose), single network, deployable to any cloud with no code changes (no cloud-specific SDKs used).</text>
</svg>
</body></html>
